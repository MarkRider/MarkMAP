<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WITHI v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<style>
/* Layout: full-bleed 3D map; floating glass cards — maneuver (bottom-left), info panel (right), status (top), dock (bottom). */
:root{
  --bg:#070d17; --glass:rgba(14,22,36,.78); --glass-strong:rgba(12,19,32,.9);
  --line:rgba(140,190,230,.16); --fg:#eef4fb; --muted:#8fa3b9; --dim:#5d7088;
  --route:#22e3f2; --route-glow:rgba(34,227,242,.35);
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff5d5d;
  --radius:18px;
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  color-scheme:dark;
}
:root[data-mode="day"]{
  --bg:#e9edf2; --glass:rgba(255,255,255,.82); --glass-strong:rgba(255,255,255,.94);
  --line:rgba(30,50,80,.12); --fg:#0f1b2b; --muted:#53657a; --dim:#8a99aa;
  --route:#0aa5c4; --route-glow:rgba(10,165,196,.25);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--route);outline-offset:2px}
#map{position:absolute;inset:0}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.28)}

/* status bar */
#status{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;z-index:5;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent)}
:root[data-mode="day"] #status{background:linear-gradient(to bottom,rgba(255,255,255,.6),transparent)}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-weight:700;letter-spacing:.28em;font-size:18px}
.brand span{color:var(--muted);font-size:13px}
.stat{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}
.stat .pill{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px}
.stat .pill.live{color:var(--ok);border-color:rgba(61,220,132,.4)}
.stat .pill.sim{color:var(--route);border-color:var(--route-glow)}
#clock{color:var(--fg);font-weight:600;font-size:15px}

/* maneuver card */
#maneuver{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  display:flex;gap:14px;align-items:center;padding:14px 18px 14px 14px;min-width:260px;max-width:min(440px,calc(100vw - 32px));z-index:4}
#maneuver .ic{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:14px;background:rgba(34,227,242,.12)}
#maneuver .ic svg{width:44px;height:44px}
#maneuver .d{font-size:30px;font-weight:700;line-height:1.05}
#maneuver .t{font-size:16px;font-weight:600;margin-top:2px}
#maneuver .r{font-size:13px;color:var(--muted);margin-top:2px}
#nextman{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(166px + env(safe-area-inset-bottom,0px));
  font-size:13px;padding:6px 12px;border-radius:12px;color:var(--muted);z-index:4}

/* info panel */
#panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 56px);
  width:300px;max-height:calc(100% - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:18px;z-index:4}
#panel h2{margin:0 0 2px;font-size:20px;font-weight:700;text-wrap:balance}
#panel .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.big{font-size:44px;font-weight:600;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:500;margin-left:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row span:first-child{color:var(--muted)}
.row b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip.ok{color:var(--ok);border-color:rgba(61,220,132,.45)}
.batt{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.batt .cell{width:44px;height:20px;border:2px solid currentColor;border-radius:5px;position:relative;padding:2px}
.batt .cell::after{content:"";position:absolute;right:-6px;top:5px;width:3px;height:7px;background:currentColor;border-radius:0 2px 2px 0}
.batt .fill{height:100%;border-radius:2px;background:currentColor}
.batt .pct{font-size:30px;font-weight:600}
.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1 1 auto;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--route);color:#04121a;border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 11px;width:100%}
.item .n{font-weight:600;font-size:14px}
.item .m{font-size:12px;color:var(--muted)}
.item .k{font-weight:700;color:var(--route);white-space:nowrap}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;color:var(--route);border:1px solid var(--route-glow);border-radius:6px;padding:1px 6px;margin-bottom:8px}

/* dock */
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--glass-strong);border-top:1px solid var(--line);z-index:6}
#dock button{background:transparent;border:0;border-radius:12px;width:52px;height:48px;display:grid;place-items:center;color:var(--muted)}
#dock button.on{color:var(--route)}
#dock button:hover{color:var(--fg)}
#dock svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#dock .sep{width:1px;background:var(--line);margin:8px 6px}

/* sheets */
.sheet{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);width:min(520px,calc(100vw - 32px));padding:14px;z-index:8;max-height:calc(100% - 140px);overflow:auto}
.sheet h3{margin:0 0 10px;font-size:16px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(0,0,0,.15);color:var(--fg);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px}
:root[data-mode="day"] .search input{background:rgba(255,255,255,.7)}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.field select,.field input{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;width:140px}
.field select option{background:#101826;color:#eef4fb}
.close{float:right;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1}

#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100vw - 32px)}

/* markers */
.car{width:34px;height:34px}
.car svg{width:100%;height:100%;filter:drop-shadow(0 0 8px var(--route))}
.pin{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--route);box-shadow:0 0 18px var(--route);border:2px solid #fff}
.pin svg{transform:rotate(45deg);width:18px;height:18px}
.poi{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--glass-strong);border:1.5px solid var(--route);cursor:pointer}
.poi svg{width:15px;height:15px}
.lm{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--glass-strong);border:1px solid var(--line);white-space:nowrap;color:var(--fg)}
.menu{display:flex;flex-direction:column;gap:6px;padding:8px}
.menu button{border:1px solid var(--line);background:var(--glass-strong);border-radius:10px;padding:8px 12px;text-align:left;font-size:14px}
.maplibregl-popup-content{background:transparent;padding:0;box-shadow:none}
.maplibregl-popup-tip{display:none}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(0,0,0,.35)!important;color:#9ab}
.maplibregl-ctrl-attrib a{color:#9ab}
.maplibregl-ctrl-bottom-right{bottom:calc(64px + env(safe-area-inset-bottom,0px))}

/* narrow / portrait */
@media (max-width:720px){
  #panel{top:auto;right:16px;left:16px;width:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-height:38vh;padding:14px}
  #panel .big{font-size:34px}
  #maneuver{top:calc(env(safe-area-inset-top,0px) + 48px);bottom:auto;left:16px;right:16px;max-width:none}
  #nextman{top:calc(env(safe-area-inset-top,0px) + 140px);bottom:auto}
  .brand span{display:none}
  #dock button{width:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="แผนที่ 3 มิติ"></div>

<header id="status">
  <div class="brand"><b>WITHI</b><span>วิถี · v1</span></div>
  <div class="stat">
    <span id="gpsPill" class="pill">ตัวอย่าง</span>
    <span id="phoneBatt" class="num"></span>
    <span id="clock" class="num">--:--</span>
  </div>
</header>

<div id="nextman" class="glass" hidden></div>
<section id="maneuver" class="glass" aria-live="polite" hidden>
  <div class="ic" id="manIcon"></div>
  <div style="min-width:0">
    <div class="d num" id="manDist">—</div>
    <div class="t" id="manText">—</div>
    <div class="r" id="manRoad"></div>
  </div>
</section>

<aside id="panel" class="glass" aria-live="polite"></aside>

<section id="searchSheet" class="sheet glass" hidden>
  <button class="close" data-close="searchSheet" aria-label="ปิด">×</button>
  <h3>ไปที่ไหนดี</h3>
  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="ค้นหาสถานที่ เช่น สยามพารากอน" autocomplete="off" enterkeyhint="search">
    <button class="btn primary" type="submit" style="flex:none">ค้นหา</button>
  </form>
  <div class="list" id="results"></div>
</section>

<section id="settingsSheet" class="sheet glass" hidden>
  <button class="close" data-close="settingsSheet" aria-label="ปิด">×</button>
  <h3>ตั้งค่า</h3>
  <label class="field">ประเภทรถ<select id="sVehicle"><option value="ev">ไฟฟ้า (EV)</option><option value="fuel">น้ำมัน / ไฮบริด</option></select></label>
  <label class="field">แบตเตอรี่ตอนนี้ (%)<input id="sBattery" type="number" min="1" max="100" step="1"></label>
  <label class="field">ความจุแบต (kWh)<input id="sCapacity" type="number" min="10" max="200" step="1"></label>
  <label class="field">อัตราใช้ไฟ (kWh/100 กม.)<input id="sCons" type="number" min="8" max="40" step="0.5"></label>
  <label class="field">ชื่อบนแผนที่<select id="sLang"><option value="th">ภาษาไทย</option><option value="en">English</option></select></label>
  <label class="field">โหมดสี<select id="sTheme"><option value="auto">อัตโนมัติตามเวลา</option><option value="night">กลางคืน</option><option value="day">กลางวัน</option></select></label>
  <label class="field">ความเร็วจำลอง<select id="sSim"><option value="1">x1 (ตามจริง)</option><option value="2">x2</option><option value="4">x4</option><option value="8">x8</option></select></label>
  <p class="note">ข้อมูลแผนที่และอาคาร © OpenStreetMap contributors ผ่าน OpenFreeMap · เส้นทางจาก OSRM · ค้นหาจาก Nominatim · จุดชาร์จและปั๊มจาก OpenStreetMap (Overpass) · ความสูงตึกมาจากแท็ก OSM ตึกที่ไม่มีข้อมูลจะแสดงเตี้ยกว่าจริง</p>
</section>

<div id="toast" class="glass" hidden></div>

<nav id="dock" aria-label="เมนู">
  <button id="bSearch" title="ค้นหาปลายทาง" aria-label="ค้นหาปลายทาง"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  <button id="bNearby" title="จุดชาร์จใกล้เคียง" aria-label="จุดชาร์จใกล้เคียง"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
  <button id="bCenter" title="กลับมาที่ตำแหน่ง" aria-label="กลับมาที่ตำแหน่ง"><svg viewBox="0 0 24 24"><path d="M12 3l7 18-7-4-7 4z"/></svg></button>
  <span class="sep"></span>
  <button id="bHome" title="ภาพรวมเส้นทาง" aria-label="ภาพรวมเส้นทาง"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
  <span class="sep"></span>
  <button id="bTheme" title="กลางวัน/กลางคืน" aria-label="สลับกลางวันกลางคืน"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button>
  <button id="bVoice" title="เสียงนำทาง" aria-label="เปิดปิดเสียงนำทาง"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path id="voiceWave" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></button>
  <button id="bSettings" title="ตั้งค่า" aria-label="ตั้งค่า"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
</nav>

<script>
"use strict";
/* ============================================================
   WITHI v1 — web prototype
   Data: OpenFreeMap (OSM vector tiles), OSRM, Nominatim/Photon, Overpass
   ============================================================ */

/* ---------- config ---------- */
const API = {
  tiles: "https://tiles.openfreemap.org/planet",
  glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
  osrm: "https://router.project-osrm.org/route/v1/driving/",
  nominatim: "https://nominatim.openstreetmap.org/search",
  photon: "https://photon.komoot.io/api/",
  overpass: "https://overpass-api.de/api/interpreter"
};
const TH_BBOX = [97.3, 5.6, 105.7, 20.5];
const DEMO = {
  origin: { lngLat: [100.5088, 13.7185], name: "ถนนเจริญนคร" },
  fallbackDest: { lngLat: [100.5104, 13.7267], name: "ไอคอนสยาม" },
  view: { center: [100.5112, 13.7232], zoom: 15.6, pitch: 62, bearing: -28 }
};
const LANDMARKS = [
  { name: "ไอคอนสยาม", en: "ICONSIAM", lngLat: [100.5104, 13.7267] },
  { name: "คิง เพาเวอร์ มหานคร", en: "King Power MahaNakhon", lngLat: [100.5283, 13.7236] },
  { name: "สเตท ทาวเวอร์", en: "State Tower", lngLat: [100.5167, 13.7216] }
];

/* ---------- settings (per-device) ---------- */
const DEFAULTS = { vehicle: "ev", battery: 68, capacity: 60, consumption: 15, lang: "th", theme: "auto", voice: true, sim: 4 };
const S = Object.assign({}, DEFAULTS, loadSettings());
function loadSettings() { try { return JSON.parse(localStorage.getItem("withi.settings") || "{}"); } catch (e) { return {}; } }
function saveSettings() { try { localStorage.setItem("withi.settings", JSON.stringify(S)); } catch (e) {} }

/* ---------- small utils ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const R_EARTH = 6371008.8;
const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
function haversine(a, b) {
  const dLat = toRad(b[1] - a[1]), dLon = toRad(b[0] - a[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(toRad(b[0] - a[0])) * Math.cos(toRad(b[1]));
  const x = Math.cos(toRad(a[1])) * Math.sin(toRad(b[1])) - Math.sin(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.cos(toRad(b[0] - a[0]));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
function angleLerp(a, b, t) { let d = ((b - a + 540) % 360) - 180; return (a + d * t + 360) % 360; }
function roundM(m) { return m < 100 ? Math.max(10, Math.round(m / 10) * 10) : Math.round(m / 50) * 50; }
function kmStr(m) { return m < 10000 ? (m / 1000).toFixed(1).replace(/\.0$/, "") : String(Math.round(m / 1000)); }
function fmtDist(m) { return roundM(m) < 1000 ? roundM(m) + " ม." : kmStr(m) + " กม."; }
function spokenDist(m) { return roundM(m) < 1000 ? roundM(m) + " เมตร" : kmStr(m) + " กิโลเมตร"; }
function fmtDur(s) { const m = Math.round(s / 60); if (m < 60) return m + " นาที"; return Math.floor(m / 60) + " ชม. " + (m % 60) + " นาที"; }
function fmtClock(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function toast(msg, ms = 3200) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms); }
async function getJSON(url, opts = {}, timeoutMs = 15000) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeoutMs);
  try { const r = await fetch(url, Object.assign({ signal: ctl.signal }, opts)); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}

/* ---------- Thai turn instructions (OSRM maneuver -> Thai) ---------- */
const MOD_TH = {
  "straight": "ตรงไป", "right": "เลี้ยวขวา", "left": "เลี้ยวซ้าย",
  "slight right": "เบี่ยงขวา", "slight left": "เบี่ยงซ้าย",
  "sharp right": "เลี้ยวขวาหักศอก", "sharp left": "เลี้ยวซ้ายหักศอก", "uturn": "กลับรถ"
};
function sideTh(mod) { return /left/.test(mod || "") ? "ซ้าย" : /right/.test(mod || "") ? "ขวา" : ""; }

  if (!list.length) h += '<p class="note">ไม่พบข้อมูลใน OpenStreetMap บริเวณนี้</p>';
  h += '<div class="list">' + list.slice(0, 12).map((p, i) => {
    const s = socketsOf(p.tags);
    return '<button class="item" data-i="' + i + '"><div><div class="n">' + esc(p.name) + '</div><div class="m">' + fmtDist(p.dist) +
      (s.list.length ? " · " + esc(s.list.join(", ")) : "") + "</div></div>" + (kind === "charge" && s.kw ? '<div class="k num">' + Math.round(s.kw) + " kW</div>" : "") + "</button>";
  }).join("") + "</div>";
  $("panel").innerHTML = h; $("panel").hidden = false;
  $("panel").querySelectorAll(".item").forEach(b => b.onclick = () => { const p = list[+b.dataset.i]; setDestination(p); });
}

/* ---------- maneuver card ---------- */
function currentStepIndex() {
  const s = st.steps; for (let i = 0; i < s.length; i++) if (s[i].along > st.along + 3) return i; return s.length - 1;
}
function updateManeuver() {
  if (!st.steps.length) return;
  const i = currentStepIndex(), step = st.steps[i], dist = Math.max(0, step.along - st.along);
  $("maneuver").hidden = false;
  $("manIcon").innerHTML = arrowSvg(maneuverKind(step));
  $("manDist").textContent = fmtDist(dist);
  $("manText").textContent = step.textShort;
  const curRoad = i > 0 ? st.steps[i - 1].road : st.departRoad;
  $("manRoad").textContent = curRoad ? "บน" + curRoad : "";
  const nx = st.steps[i + 1];
  if (nx && step.along - st.along < 400 && nx.along - step.along < 250) { $("nextman").hidden = false; $("nextman").textContent = "จากนั้น " + nx.textShort; }
  else $("nextman").hidden = true;
  speakFor(i, dist);
}

/* ---------- voice ---------- */
let thVoice = null;
function pickVoice() { try { const v = speechSynthesis.getVoices(); thVoice = v.find(x => /^th/i.test(x.lang)) || null; } catch (e) {} }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!S.voice || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "th-TH"; if (thVoice) u.voice = thVoice; u.rate = 1.0; speechSynthesis.speak(u); } catch (e) {}
}
function speakFor(i, dist) {
  const step = st.steps[i]; if (!step || st.mode !== "nav") return;
  const key = (b) => i + ":" + b;
  // stages ordered far -> near; speak only the nearest stage reached, once
  const plan = step.kind === "arrive" ? [[300, "far"], [30, "now"]] : [[800, "far"], [250, "mid"], [40, "now"]];
  const reached = plan.filter(([t]) => dist <= t);
  if (!reached.length) return;
  const [th, tag] = reached[reached.length - 1];
  if (st.spoken[key(tag)]) return;
  plan.forEach(([t2, g2]) => { if (t2 >= th) st.spoken[key(g2)] = true; });
  if (tag === "now") { if (step.kind !== "arrive") say(step.text); }
  else say("อีก " + spokenDist(dist) + " " + step.text);
}

/* ---------- routing ---------- */
async function route(from, to) {
  const url = API.osrm + from[0] + "," + from[1] + ";" + to[0] + "," + to[1] + "?overview=full&geometries=geojson&steps=true&alternatives=false";
  const j = await getJSON(url);
  if (j.code !== "Ok" || !j.routes || !j.routes.length) throw new Error(j.message || "no route");
  return j.routes[0];
}
function prepareRoute(r) {
  st.route = r; st.track = buildTrack(r.geometry.coordinates);
  const steps = [];
  let from = 0;
  r.legs.forEach(leg => leg.steps.forEach(s => {
    const pj = project(st.track, s.maneuver.location, Math.max(0, from - 2), st.track.xy.length - 1);
    from = pj.i;
    const text = thaiInstruction(s);
    steps.push({ raw: s, along: pj.along, text, textShort: text, road: roadOf(s), kind: maneuverKind(s) });
  }));
  // drop the "depart" step: the card should always show the next real maneuver
  st.departRoad = steps.length ? steps[0].road : "";
  st.steps = steps.length > 1 && steps[0].raw.maneuver.type === "depart" ? steps.slice(1) : steps;
  st.routeGeo = { type: "Feature", geometry: r.geometry, properties: {} };
  st.doneGeo = EMPTY; st.along = 0; st.spoken = {};
  setData("routeAll", st.routeGeo); setData("routeDone", EMPTY);
}
function fitRoute() {
  if (!st.track) return;
  const b = new maplibregl.LngLatBounds(); st.track.coords.forEach(c => b.extend(c));
  const wide = innerWidth > 720;
  map.fitBounds(b, { padding: { top: 90, bottom: wide ? 110 : innerHeight * 0.45, left: 40, right: wide ? 360 : 40 }, pitch: 55, bearing: map.getBearing(), duration: 1200, maxZoom: 16.5 });
}
function updateRange() {
  st.rangeGeo = S.vehicle === "ev" ? circlePoly(st.origin.lngLat, rangeKm() * 1000) : EMPTY;
  setData("range", st.rangeGeo);
}
async function setDestination(p) {
  closeSheets();
  st.dest = p; stopNav(true);
  if (destMarker) destMarker.remove();
  destMarker = new maplibregl.Marker({ element: pinEl(p.charger ? "charge" : "place"), anchor: "bottom" }).setLngLat(p.lngLat).addTo(map);
  $("panel").innerHTML = '<h2>' + esc(p.name) + '</h2><div class="sub">กำลังหาเส้นทาง…</div>'; $("panel").hidden = false;
  try {
    const r = await route(st.origin.lngLat, p.lngLat);
    prepareRoute(r); updateRange(); renderPreview(); fitRoute();
  } catch (e) {
    $("panel").innerHTML = '<h2>' + esc(p.name) + '</h2><div class="sub">หาเส้นทางไม่ได้ ลองใหม่อีกครั้ง หรือเลือกจุดอื่น</div>';
  }
}
function setOrigin(lngLat, name) {
  st.origin = { lngLat, name: name || "จุดที่เลือก" };
  if (originMarker) originMarker.remove();
  originMarker = new maplibregl.Marker({ element: carEl(), rotationAlignment: "map", pitchAlignment: "map" }).setLngLat(lngLat).addTo(map);
  carMarker = originMarker;
  updateRange();
  if (st.dest) setDestination(st.dest);
}

/* ---------- navigation loop ---------- */
function showRecenter(on) { $("bCenter").classList.toggle("on", !!on); }
function startNav(source) {
  if (!st.track) return;
  st.mode = "nav"; st.source = source; st.along = 0; st.spoken = {}; st.follow = true; st.heading = bearing(st.track.coords[0], st.track.coords[Math.min(3, st.track.coords.length - 1)]);
  setPill(source === "sim" ? "sim" : "gps-wait");
  renderNavPanel(); updateManeuver();
  say(source === "sim" ? "เริ่มจำลองการนำทาง " + st.steps[0].text : "เริ่มนำทาง");
  if (source === "sim") { st.lastT = performance.now(); cancelAnimationFrame(st.raf); st.raf = requestAnimationFrame(simTick); }
  else startGps();
}
function stopNav(silent) {
  cancelAnimationFrame(st.raf); st.raf = 0;
  if (st.gpsWatch != null) { navigator.geolocation.clearWatch(st.gpsWatch); st.gpsWatch = null; }
  const wasNav = st.mode === "nav";
  st.mode = "preview"; $("maneuver").hidden = true; $("nextman").hidden = true;
  setPill(st.source === "demo" ? "demo" : "idle");
  if (wasNav && !silent) { setData("routeDone", EMPTY); if (carMarker && st.origin) carMarker.setLngLat(st.origin.lngLat); renderPreview(); fitRoute(); }
}
let lastPanel = 0, lastDone = 0;
function simTick(now) {
  const dt = Math.min(0.1, (now - st.lastT) / 1000); st.lastT = now;
  const i = currentStepIndex(), toTurn = st.steps[i] ? st.steps[i].along - st.along : 999;
  const cruise = 13.9;                                  // ~50 km/h
  const v = toTurn < 60 ? 6 : toTurn < 150 ? 9 : cruise; // slow down near turns
  st.along += v * dt * (+S.sim || 1);
  advance(pointAt(st.track, st.along).ll, null, now);
  if (st.along >= st.track.len - 2) return arrive();
  st.raf = requestAnimationFrame(simTick);
}
function advance(ll, gpsHeading, now) {
  const ahead = pointAt(st.track, st.along + 25).ll;
  const target = gpsHeading != null && !isNaN(gpsHeading) ? gpsHeading : bearing(ll, ahead);
  st.heading = angleLerp(st.heading, target, 0.12);
  if (carMarker) { carMarker.setLngLat(ll); carMarker.setRotation(st.heading); }
  if (st.follow) {
    map.jumpTo({ center: ll, bearing: st.heading, pitch: 62, zoom: 17.3, padding: { top: innerHeight * (innerWidth > 720 ? 0.42 : 0.5), bottom: 0, left: 0, right: innerWidth > 720 ? 300 : 0 } });
  }
  if (now - lastDone > 250) { lastDone = now; st.doneGeo = { type: "Feature", geometry: { type: "LineString", coordinates: sliceTo(st.track, st.along) }, properties: {} }; setData("routeDone", st.doneGeo); }
  updateManeuver();
  if (now - lastPanel > 1000) { lastPanel = now; renderNavPanel(); }
}
function arrive() {
  say("ถึงที่หมายแล้ว");
  toast("ถึง " + st.dest.name + " แล้ว");
  st.mode = "preview"; cancelAnimationFrame(st.raf);
  if (st.gpsWatch != null) { navigator.geolocation.clearWatch(st.gpsWatch); st.gpsWatch = null; }
  $("maneuver").hidden = true; $("nextman").hidden = true;
  setTimeout(() => { if (st.mode !== "nav") { renderPreview(); } }, 1500);
}

/* ---------- GPS ---------- */
function setPill(kind) {
  const p = $("gpsPill");
  p.className = "pill" + (kind === "gps" ? " live" : kind === "sim" ? " sim" : "");
  p.textContent = { demo: "ตัวอย่าง", sim: "จำลอง", gps: "GPS", "gps-wait": "รอ GPS…", idle: "พร้อม" }[kind] || "พร้อม";
}
function startGps() {
  if (!("geolocation" in navigator)) { toast("อุปกรณ์นี้ไม่มี GPS ให้ใช้"); stopNav(); return; }
  st.offCount = 0;
  st.gpsWatch = navigator.geolocation.watchPosition(onGps, err => {
    toast(err.code === 1 ? "ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง เปิดสิทธิ์ตำแหน่งให้เบราว์เซอร์ หรือเปิดหน้านี้ผ่านลิงก์ https" : "ยังจับสัญญาณ GPS ไม่ได้", 5000);
    if (err.code === 1) stopNav();
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
let rerouting = false;
async function onGps(pos) {
  setPill("gps");
  const ll = [pos.coords.longitude, pos.coords.latitude];
  const pj = project(st.track, ll);
  if (pj.d > 60 && !rerouting) {
    if (++st.offCount >= 3) {
      rerouting = true; toast("ออกนอกเส้นทาง กำลังหาเส้นทางใหม่"); say("กำลังหาเส้นทางใหม่");
      try { const r = await route(ll, st.dest.lngLat); st.origin = { lngLat: ll, name: "ตำแหน่งปัจจุบัน" }; prepareRoute(r); updateRange(); } catch (e) { toast("หาเส้นทางใหม่ไม่ได้"); }
      rerouting = false; st.offCount = 0; return;
    }
  } else st.offCount = 0;
  st.along = Math.max(st.along, pj.along);
  const spd = pos.coords.speed, hd = spd && spd > 2 ? pos.coords.heading : null;
  advance(pj.d < 30 ? pointAt(st.track, st.along).ll : ll, hd, performance.now());
  if (st.track.len - st.along < 25) arrive();
}
function useMyLocation() {
  if (!("geolocation" in navigator)) return toast("อุปกรณ์นี้ไม่มี GPS ให้ใช้");
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.longitude, p.coords.latitude];
    if (ll[0] < TH_BBOX[0] || ll[0] > TH_BBOX[2] || ll[1] < TH_BBOX[1] || ll[1] > TH_BBOX[3]) return toast("ตำแหน่งของคุณอยู่นอกประเทศไทย ใช้จุดตัวอย่างต่อ");
    st.source = "idle"; setPill("idle");
    setOrigin(ll, "ตำแหน่งปัจจุบัน");
    map.easeTo({ center: ll, zoom: 16, pitch: 60, duration: 1000 });
  }, () => toast("ใช้ตำแหน่งไม่ได้ ยังใช้จุดตัวอย่างอยู่ (เปิดสิทธิ์ตำแหน่งในเบราว์เซอร์)", 4500), { enableHighAccuracy: true, timeout: 12000 });
}

/* ---------- search ---------- */
async function search(q) {
  const res = $("results"); res.innerHTML = '<p class="note">กำลังค้นหา…</p>';
  const near = st.origin.lngLat; let items = [];
  try {
    const u = API.nominatim + "?format=jsonv2&limit=8&countrycodes=th&accept-language=" + (S.lang === "en" ? "en" : "th") + "&q=" + encodeURIComponent(q) +
      "&viewbox=" + (near[0] - 0.6) + "," + (near[1] + 0.6) + "," + (near[0] + 0.6) + "," + (near[1] - 0.6);
    const j = await getJSON(u, { headers: { "Accept": "application/json" } }, 10000);
    items = j.map(x => ({ name: x.name || x.display_name.split(",")[0], sub: x.display_name.split(",").slice(1, 3).join(",").trim(), lngLat: [+x.lon, +x.lat] }));
  } catch (e) { /* fall through to photon */ }
  if (!items.length) {
    try {
      const u = API.photon + "?limit=8&q=" + encodeURIComponent(q) + "&lat=" + near[1] + "&lon=" + near[0] + "&bbox=" + TH_BBOX.join(",");
      const j = await getJSON(u, {}, 10000);
      items = (j.features || []).map(f => ({ name: f.properties.name || f.properties.street || q, sub: [f.properties.district, f.properties.city || f.properties.state].filter(Boolean).join(", "), lngLat: f.geometry.coordinates }));
    } catch (e) {}
  }
  items.forEach(it => it.dist = haversine(near, it.lngLat)); items.sort((a, b) => a.dist - b.dist);
  if (!items.length) { res.innerHTML = '<p class="note">ไม่พบสถานที่นี้ ลองพิมพ์ชื่อให้สั้นลง หรือใช้ชื่อภาษาอังกฤษ</p>'; return; }
  res.innerHTML = items.map((it, i) => '<button class="item" data-i="' + i + '"><div><div class="n">' + esc(it.name) + '</div><div class="m">' + esc(it.sub || "") + '</div></div><div class="k num">' + fmtDist(it.dist) + "</div></button>").join("");
  res.querySelectorAll(".item").forEach(b => b.onclick = () => { st.source = st.source === "demo" ? "idle" : st.source; setPill("idle"); setDestination(items[+b.dataset.i]); });
}

/* ---------- nearby chargers / fuel (Overpass) ---------- */
async function nearby(center, kind) {
  const tag = kind === "charge" ? '["amenity"="charging_station"]' : '["amenity"="fuel"]';
  const q = "[out:json][timeout:20];nwr" + tag + "(around:5000," + center[1] + "," + center[0] + ");out center tags 60;";
  const j = await getJSON(API.overpass + "?data=" + encodeURIComponent(q), {}, 25000);
  return (j.elements || []).map(e => {
    const ll = e.type === "node" ? [e.lon, e.lat] : [e.center.lon, e.center.lat];
    const t = e.tags || {};
    const nm = (S.lang === "en" ? (t["name:en"] || t.name) : (t["name:th"] || t.name)) || t.brand || t.operator || (kind === "charge" ? "สถานีชาร์จ" : "ปั๊มน้ำมัน");
    return { name: nm, lngLat: ll, tags: t, charger: kind === "charge", dist: haversine(center, ll), sub: [t.operator || t.brand, t["addr:street"]].filter(Boolean).join(" · ") };
  }).sort((a, b) => a.dist - b.dist);
}
async function showNearby(center) {
  const kind = S.vehicle === "ev" ? "charge" : "fuel";
  $("panel").innerHTML = "<h2>" + (kind === "charge" ? "สถานีชาร์จใกล้เคียง" : "ปั๊มน้ำมันใกล้เคียง") + '</h2><div class="sub">กำลังโหลดจาก OpenStreetMap…</div>'; $("panel").hidden = false;
  try { const list = await nearby(center || st.origin.lngLat, kind); drawPois(list, kind); renderNearby(list, center, kind); }
  catch (e) { $("panel").innerHTML = '<h2>โหลดข้อมูลไม่ได้</h2><div class="sub">บริการ Overpass ไม่ตอบ ลองใหม่อีกครั้งในอีกสักครู่</div>'; }
}
function drawPois(list, kind) {
  st.poiMarkers.forEach(m => m.remove()); st.poiMarkers = [];
  list.slice(0, 30).forEach(p => {
    const el = document.createElement("button"); el.className = "poi"; el.title = p.name; el.setAttribute("aria-label", p.name);
    el.innerHTML = kind === "charge" ? '<svg viewBox="0 0 24 24" fill="var(--route)"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>' : '<svg viewBox="0 0 24 24" fill="var(--route)"><rect x="5" y="4" width="10" height="16" rx="2"/><path d="M15 9h2l2 3v6" stroke="var(--route)" stroke-width="2" fill="none"/></svg>';
    el.onclick = ev => { ev.stopPropagation(); setDestination(p); };
    st.poiMarkers.push(new maplibregl.Marker({ element: el }).setLngLat(p.lngLat).addTo(map));
  });
}

let menuPopup;
function openPointMenu(lngLat) {
  if (menuPopup) menuPopup.remove();

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $(b.dataset.close).hidden = true);
$("bSearch").onclick = () => { const s = $("searchSheet"), was = s.hidden; closeSheets(); s.hidden = !was; if (!s.hidden) setTimeout(() => $("q").focus(), 50); };
$("searchForm").onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); if (q) search(q); };
$("bNearby").onclick = () => { closeSheets(); showNearby(st.mode === "nav" && carMarker ? [carMarker.getLngLat().lng, carMarker.getLngLat().lat] : st.origin.lngLat); };
$("bCenter").onclick = () => {

  useMyLocation();
};
$("bHome").onclick = () => { closeSheets(); if (st.mode !== "nav" && st.route) { renderPreview(); fitRoute(); } else if (!st.route) map.easeTo(Object.assign({ duration: 1000 }, DEMO.view)); };
$("bTheme").onclick = () => { S.theme = st.dayMode ? "night" : "day"; saveSettings(); refreshStyle(); $("sTheme").value = S.theme; };
$("bVoice").onclick = () => { S.voice = !S.voice; saveSettings(); syncVoiceBtn(); if (!S.voice) try { speechSynthesis.cancel(); } catch (e) {} else say("เปิดเสียงนำทาง"); };
function syncVoiceBtn() { $("bVoice").classList.toggle("on", S.voice); $("voiceWave").style.display = S.voice ? "" : "none"; }
$("bSettings").onclick = () => { const s = $("settingsSheet"), was = s.hidden; closeSheets(); s.hidden = !was; };
function refreshStyle() { applyMode(); if (map) map.setStyle(buildStyle(st.dayMode)); }
function bindSettings() {
  const f = { sVehicle: "vehicle", sBattery: "battery", sCapacity: "capacity", sCons: "consumption", sLang: "lang", sTheme: "theme", sSim: "sim" };
  Object.keys(f).forEach(id => {
    const el = $(id); el.value = S[f[id]];
    el.onchange = () => {
      const k = f[id]; let v = el.value;
      if (["battery", "capacity", "consumption"].includes(k)) { v = parseFloat(v); if (isNaN(v)) { el.value = S[k]; return; } }
      S[k] = v; saveSettings();
      if (k === "theme" || k === "lang") refreshStyle();
      if (k === "vehicle") $("bNearby").title = v === "ev" ? "จุดชาร์จใกล้เคียง" : "ปั๊มน้ำมันใกล้เคียง";
      updateRange(); if (st.mode !== "nav" && st.route) renderPreview();
    };
  });
}

/* ---------- boot ---------- */
async function onMapLoad() {
  placeLandmarks();
  setOrigin(DEMO.origin.lngLat, DEMO.origin.name);
  st.source = "demo"; setPill("demo");
  // demo destination: best charger near ICONSIAM, else ICONSIAM itself
  let dest = DEMO.fallbackDest;
  if (S.vehicle === "ev") {
    try {
      const list = await nearby(DEMO.fallbackDest.lngLat, "charge");
      const near = list.filter(p => p.dist < 2500 && haversine(DEMO.origin.lngLat, p.lngLat) > 800);
      near.sort((a, b) => (socketsOf(b.tags).kw - socketsOf(a.tags).kw) || (a.dist - b.dist));
      if (near.length) { dest = near[0]; drawPois(list, "charge"); }
    } catch (e) { /* keep fallback */ }
  }
  st.source = "demo";
  await setDestination(dest);
}

$("panel").innerHTML = '<span class="tag">ตัวอย่าง</span><h2>กำลังโหลดแผนที่กรุงเทพฯ</h2><div class="sub">แตะค้างหรือคลิกขวาบนแผนที่เพื่อเลือกจุด</div>';
initMap();
// keep style in sync with time of day when on auto
setInterval(() => { if (S.theme === "auto" && st.dayMode === isNight()) refreshStyle(); }, 60000);
</script>
